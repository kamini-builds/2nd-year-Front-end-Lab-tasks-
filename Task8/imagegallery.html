
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: purple;
        }

        .gallery {
            background: white;
            padding: 20px;
            width: 70%;
            margin: auto;
            border-radius: 10px;
        }

        #mainImage {
            width: 450px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .thumbnail {
            width: 120px;
            height: 80px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 5px;
        }

        .thumbnail:hover {
            border: 3px solid purple;
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <h2>Main Image</h2>

        <img id="mainImage"
        src="https://picsum.photos/id/10/600/400">

        <h3>Select an Image</h3>

        <img class="thumbnail"
        src="https://picsum.photos/id/10/600/400">

        <img class="thumbnail"
        src="https://picsum.photos/id/20/600/400">

        <img class="thumbnail"
        src="https://picsum.photos/id/30/600/400">

        <img class="thumbnail"
        src="https://picsum.photos/id/40/600/400">

    </div>
    <script>
        let mainImage = document.getElementById("mainImage");
        let thumbnails = document.querySelectorAll(".thumbnail");
        thumbnails.forEach(function(image) {
            image.addEventListener("click", function() {
                mainImage.src = image.src;
            });
        });

    </script>
</body>
</html>
