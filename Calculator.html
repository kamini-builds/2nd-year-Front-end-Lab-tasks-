<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        div{
            width: 240px;
            height: 320px;
            border: solid  black;
            text-align: center;
            margin: 30px;
            background-color: rgb(139, 224, 41);

        }
        #display{
            width: 220px;
            padding:5px;
            margin-top: 3px;
            margin-bottom: 5px;

        }
       
        table{
            border: solid black;
            background-color: rgb(99, 22, 241);
            text-align: center;
            margin: auto;
            width :200px;
            height: 200px;

        }
        button{
            width: 50px;
            height: 50px;
        }
    </style>
</head>
<body>
    <h1>Calculator</h1>
      <div class="calculator">
        <input type="text" id="display" readonly>
        <table>
            <tr>
                <td><button>AC</button></td>
                <td><button >/</button></td>
                <td><button >*</button></td>
                <td><button >-</button></td>
            </tr>

            <tr>
                <td><button >7</button></td>
                <td><button >8</button></td>
                <td><button >9</button></td>
                <td><button >+</button></td>
            </tr>

            <tr>
                <td><button >4</button></td>
                <td><button >5</button></td>
                <td><button >6</button></td>
                <td><button >=</button></td>
            </tr>

            <tr>
                <td><button >1</button></td>
                <td><button >2</button></td>
                <td><button >3</button></td>
                <td><button >.</button></td>
            </tr>

            <tr>
                <td colspan="4">
                    <button >0</button>
                </td>
            </tr>
        </table>
        <script>
            const display = document.getElementById('display');
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const value = button.textContent;
                    if (value === 'AC') {
                        display.value = '';
                    } else if (value === '=') {
                        try {
                            display.value = eval(display.value);
                        } catch (error) {
                            display.value = 'Error';
                        }
                    } else {
                        display.value += value;
                    }
                });
            });
        </script>
</body>
</html>
